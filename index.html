<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Rasyancut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@200;300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261017w">
</head>
<body>
  <main class="stage" id="stage">
    <div class="hud" aria-hidden="true">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    </div>

    <div class="tree-box" id="tree-box">
    <!-- 등장 중 훑고 올라가는 스캔선 (HTML 레이어라서 GPU 가 움직인다) -->
    <div class="reveal-front" id="reveal-front" aria-hidden="true"></div>
    <svg id="tree" class="tree revealing" viewBox="10 -30 660 870" role="img" aria-label="세피로트의 나무" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- 데이터는 assets/tree-data.js 에서 script.js 가 채운다 -->
        <path id="tree-outline" fill-rule="evenodd"/>
        <path id="tree-outline-lite" fill-rule="evenodd"/>   <!-- 확대 중에만 쓰는 단순화 윤곽 -->
        <clipPath id="tree-clip"><use href="#tree-outline" clip-rule="evenodd"/></clipPath>

        <!-- 네온 번짐 -->
        <filter id="glow-wide" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
        <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="2.6"/>
        </filter>
        <filter id="glow-text" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="blur-1"><feGaussianBlur stdDeviation="1"/></filter>

        <!-- 홀로그램 몸통 줄무늬 -->
        <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
          <rect width="4" height="1" fill="#eeff6b" opacity=".07"/>
        </pattern>
        <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eeff6b" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fbffd0" stop-opacity=".22"/>
          <stop offset="1" stop-color="#eeff6b" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="front-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#eeff6b" stop-opacity="0"/>
          <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
          <stop offset="1" stop-color="#eeff6b" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="halo-ring">
          <stop offset=".55" stop-color="#eeff6b" stop-opacity="0"/>
          <stop offset=".8"  stop-color="#eeff6b" stop-opacity=".1"/>
          <stop offset="1"   stop-color="#eeff6b" stop-opacity="0"/>
        </radialGradient>

        <!-- 바닥 홀로그램 투영대 -->
        <linearGradient id="base-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#eeff6b" stop-opacity="0"/>
          <stop offset=".5" stop-color="#f6ffa8" stop-opacity=".7"/>
          <stop offset="1" stop-color="#eeff6b" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- 바닥 투영대 -->
      <g class="base" aria-hidden="true">
        <ellipse cx="298" cy="806" rx="318" ry="30" fill="none" stroke="url(#base-grad)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <ellipse cx="298" cy="806" rx="236" ry="21" fill="none" stroke="url(#base-grad)" stroke-width="1" stroke-dasharray="2 9" vector-effect="non-scaling-stroke" class="base-dash"/>
      </g>

        <!-- 나무 몸통 (아래→위 등장 마스크 적용) -->
        <g id="tree-body">
          <!-- 검정 속 -->
          <use href="#tree-outline" fill="#000" fill-rule="evenodd"/>
          <use href="#tree-outline" fill="url(#scanlines)" fill-rule="evenodd"/>

          <!-- 나무결 · 옹이 -->
          <g clip-path="url(#tree-clip)" class="bark">
            <path id="tree-bark" fill="none" stroke="#f4ff86" stroke-width=".7" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".42"/>
            <path id="tree-knots" fill="none" stroke="#f4ff86" stroke-width=".8" vector-effect="non-scaling-stroke" opacity=".5"/>
            <rect class="sweep" x="-60" y="-120" width="760" height="120" fill="url(#sweep)"/>
          </g>

          <!-- 윤곽선: 바깥은 네온 연노랑, 선 중심으로 갈수록 흰색 -->
          <use class="glow-layer" href="#tree-outline" fill="none" stroke="#eeff6b" stroke-width="9" opacity=".5" filter="url(#glow-wide)" fill-rule="evenodd" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use class="glow-layer" href="#tree-outline" fill="none" stroke="#eeff6b" stroke-width="3.4" opacity=".95" filter="url(#glow-soft)" fill-rule="evenodd" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline" fill="none" stroke="#f4ff86" stroke-width="3.4" fill-rule="evenodd" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline" fill="none" stroke="#fbffc8" stroke-width="2.2" fill-rule="evenodd" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline" fill="none" stroke="#ffffff" stroke-width="1.1" fill-rule="evenodd" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        </g>

        <!-- 확대(카메라 이동) 중에는 무거운 나무 대신 단순화한 윤곽으로 잠시 바꿔 그린다 -->
        <g id="tree-lite" class="tree-lite" aria-hidden="true">
          <use href="#tree-outline-lite" fill="none" stroke="#eeff6b" stroke-width="10" opacity=".13" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline-lite" fill="none" stroke="#eeff6b" stroke-width="5" opacity=".26" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline-lite" fill="none" stroke="#f4ff86" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline-lite" fill="none" stroke="#fbffc8" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          <use href="#tree-outline-lite" fill="none" stroke="#ffffff" stroke-width=".9" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        </g>


        <!-- 기둥 위 라틴어 (세로) -->
        <g id="trunk-label" class="trunk-label" aria-hidden="true">
          <text id="trunk-text" text-anchor="middle" filter="url(#glow-text)"></text>
        </g>

    </svg>
    <!-- 열매는 나무와 겹쳐 놓은 별도 레이어다. 두 레이어를 통째로 기울여(GPU) 바람에 흔들리게 하려는 구조 -->
    <svg id="tree-fruits" class="tree tree-fruits" viewBox="10 -30 660 870" aria-label="세피로트의 열매" preserveAspectRatio="xMidYMid meet">
      <g id="fruit-group" class="fruit-group"></g>
    </svg>
    </div>
  </main>

  <!-- 배경음악 켜기/끄기 -->
  <button class="bgm-toggle" id="bgm-toggle" type="button" aria-pressed="true" aria-label="배경음악 끄기" title="배경음악">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- 열매 설명창 (열매를 누르면 화면이 열매로 확대되며 오른쪽에 나타난다) -->
  <aside class="panel" id="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" aria-hidden="true" inert>
    <i class="pc tl"></i><i class="pc tr"></i><i class="pc bl"></i><i class="pc br"></i>
    <button class="panel-close" id="panel-close" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <p class="panel-kicker"><span class="dot"></span><span id="panel-kicker"></span></p>
    <h2 class="panel-title" id="panel-title"></h2>
    <div class="panel-rule" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <p class="panel-desc" id="panel-desc"></p>
    <div class="panel-actions">
      <button class="btn-enter" id="btn-enter" type="button">
        <span class="btn-label">입장</span>
        <svg viewBox="0 0 24 12" width="24" height="12" aria-hidden="true"><path d="M0 6H21M16 1L22 6L16 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-back" id="btn-back" type="button">돌아가기</button>
    </div>
  </aside>

  <!-- 라시안컷 맵 -->
  <section class="map-screen" id="map-screen" aria-hidden="true" inert>
    <canvas class="map-canvas" id="map-canvas"></canvas>
    <canvas class="fire-canvas" id="fire-canvas" aria-hidden="true"></canvas>
    <div class="map-vignette" aria-hidden="true"></div>
    <canvas class="burn-canvas" id="burn-canvas" aria-hidden="true"></canvas>
    <canvas class="portal-canvas" id="portal-canvas" aria-hidden="true"></canvas>
    <a class="portal-link" id="portal-link" href="https://thefirsttwistedking.github.io/Rasyancut-homepage/" rel="noopener">홈페이지로 이동하기 →</a>
    <p class="map-toast" id="map-toast" aria-live="polite"></p>
    <div class="map-hud">
      <div class="map-top">
        <button class="map-btn" id="map-exit" type="button">
          <svg viewBox="0 0 24 12" width="22" height="11" aria-hidden="true"><path d="M24 6H3M8 1L2 6L8 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>돌아가기</span>
        </button>
        <div class="map-title"><span>RASYANCUT</span><b>라시안컷 맵</b></div>
      </div>
      <p class="map-coords" id="map-coords"></p>
      <div class="map-zoom">
        <button id="zoom-in" type="button" aria-label="확대">+</button>
        <button id="zoom-out" type="button" aria-label="축소">−</button>
        <button id="map-home" type="button" aria-label="성역으로 이동" title="성역으로">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="1.8" fill="currentColor"/></svg>
        </button>
      </div>
      <canvas class="minimap" id="minimap" aria-label="미니맵"></canvas>
      <div class="joystick" id="joystick" aria-hidden="true"><i class="knob"></i></div>
      <button class="boost-btn" id="boost" type="button" aria-label="가속 (누르는 동안 3배 속도)">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l7 7-7 7M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="map-hint">드래그로 이동 · 휠/핀치로 확대 · Shift 가속 · 경계 밖으로 나가면 불타 재가 됩니다</p>
    </div>
  </section>

  <!-- 로딩 화면 -->
  <div class="loading" id="loading" aria-hidden="true" inert>
    <div class="loading-frame">
      <img class="loading-img" id="loading-img" alt="">
      <canvas class="loading-fx" id="loading-fx" aria-hidden="true"></canvas>
      <p class="loading-text" id="loading-text">이동 중...</p>
      <svg class="spinner" viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
        <circle class="track" cx="24" cy="24" r="19" fill="none" stroke-width="3"/>
        <circle class="arc" cx="24" cy="24" r="19" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="32 90"/>
      </svg>
    </div>
  </div>

  <!-- 화면 전환 오버레이 (테크니컬 슬랫 + 아이콘) -->
  <div class="transition" id="transition" aria-hidden="true">
    <div class="slats" id="slats"></div>
    <div class="t-icon">
      <svg viewBox="-40 -40 80 80" width="80" height="80">
        <circle r="17" fill="none" stroke="#eeff6b" stroke-width="3" opacity=".5" filter="url(#glow-soft)"/>
        <circle r="17" fill="none" stroke="#f8ffb4" stroke-width="2"/>
        <circle r="17" fill="none" stroke="#fff" stroke-width=".9"/>
        <circle class="t-spin" r="30" fill="none" stroke="#f4ff86" stroke-width="1.4" stroke-dasharray="14 8 2 8"/>
        <circle r="5" fill="#fff"/>
      </svg>
    </div>
    <div class="t-line"></div>
  </div>

  <script src="assets/tree-data.js?v=20261017w"></script>
  <script src="map.js?v=20261017w"></script>
  <script src="loading-fx.js?v=20261017w"></script>
  <script src="loading.js?v=20261017w"></script>
  <script src="script.js?v=20261017w"></script>
</body>
</html>
